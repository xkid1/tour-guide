<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Strict CSP: the README promises Electron needs no style-src 'unsafe-inline'. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'"
    />
    <title>Electron renderer</title>
    <link
      rel="stylesheet"
      href="../browser/page.css"
    />
  </head>
  <body>
    <main>
      <button id="opener">Take the tour</button>
      <div><button id="anchor">Anchor</button></div>
      <div><button id="far">Far below</button></div>
    </main>
    <!-- No bundler: the IIFE from the installed package, loaded over file:// -->
    <script src="../node_modules/@xkid1/tour-guide/dist/browser/tour-guide.iife.js"></script>
    <script src="../browser/steps.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
