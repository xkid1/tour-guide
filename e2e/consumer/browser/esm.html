<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Native ES modules, no bundler</title>
    <link
      rel="stylesheet"
      href="/browser/page.css"
    />
    <!-- The published dist/ files must load as-is in a browser (real relative .js paths). -->
    <script type="importmap">
      {
        "imports": {
          "@xkid1/tour-guide/browser": "/node_modules/@xkid1/tour-guide/dist/apps/browser/index.js"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <button id="opener">Take the tour</button>
      <div><button id="anchor">Anchor</button></div>
      <div><button id="far">Far below</button></div>
    </main>
    <script
      type="module"
      src="/browser/esm-app.js"
    ></script>
  </body>
</html>
