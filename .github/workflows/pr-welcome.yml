name: Welcome first-time contributors

on:
  issues:
    types:
      - opened
  pull_request_target:
    types:
      - opened

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      # v3 renamed the inputs to snake_case; repo_token defaults to github.token.
      - name: Welcome first-time contributors
        uses: actions/first-interaction@v3
        with:
          issue_message: >-
            Thanks for opening your first issue! A maintainer will take a look soon.
            If it's a bug, a minimal reproduction (a small HTML page, CodeSandbox or
            repository), the browser or WebView, and the entry point you import
            (`/browser`, `/react`, the IIFE…) help us fix it faster.
          pr_message: >-
            Thanks for your first pull request! Please make sure `yarn check` passes
            locally and the PR title follows Conventional Commits (for example
            `fix(position): flip when the preferred side is clipped`). See
            Contributing.md for the ground rules. A maintainer will review it soon.
