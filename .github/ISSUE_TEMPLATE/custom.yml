name: Question or other request
description: Ask how to use the library, or raise something not covered by the other forms.
title: '[Question]: '
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        The [README](https://github.com/xkid1/tour-guide#readme) has a quick start, recipes
        (show once, resume, menus and modals, async content, i18n…), framework guides and the
        full API reference. It may already answer your question.

  - type: dropdown
    id: area
    attributes:
      label: Topic
      options:
        - Usage / how do I...?
        - React, Vue, Svelte or Angular
        - Styling and theming
        - Mobile / WebView / Electron
        - TypeScript
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Question or request
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Relevant code, versions or links.
      render: typescript
