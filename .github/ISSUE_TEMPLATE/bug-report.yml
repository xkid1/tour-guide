name: Bug report
description: Report a reproducible problem with @xkid1/tour-guide.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        **Security issue?** Don't open a public issue. Report it privately instead; see [SECURITY.md](https://github.com/xkid1/tour-guide/blob/main/SECURITY.md).
        **Accessibility issue?** Use the accessibility template, so we can ask the right questions.

        Please search [existing issues](https://github.com/xkid1/tour-guide/issues?q=is%3Aissue) first.

  - type: input
    id: version
    attributes:
      label: Package version
      description: Run `npm ls @xkid1/tour-guide`, or the version in your CDN URL.
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: entry
    attributes:
      label: How do you use it?
      multiple: true
      options:
        - HTML only (<tour-guide> with <tour-step> children)
        - createTour() (@xkid1/tour-guide/browser)
        - Element API (steps / options properties)
        - Script tag / CDN (IIFE bundle)
        - React adapter
        - Vue adapter
        - Svelte action
        - Angular
        - Electron
        - Android / iOS / React Native WebView bridge
        - Resume (@xkid1/tour-guide/resume)
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: What goes wrong?
      multiple: true
      options:
        - Positioning / placement / arrow
        - Spotlight / backdrop
        - Scrolling to the target
        - Animation
        - Mobile layout
        - Keyboard / focus
        - Navigation, hooks or events
        - Styling / theming (CSS variables, parts)
        - TypeScript types
        - Installation / packaging / SSR
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        A link to a small CodeSandbox, StackBlitz or repository is best. Otherwise paste the
        smallest HTML/JS that shows the problem: the tour's steps and options, and the target
        elements.
      render: html
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the tour
        2. Click Next twice
        3. Resize the window
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Screenshots or a short recording help a lot for visual problems. Include console warnings and errors (`[tour-guide] …`).
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / WebView and OS
      placeholder: Chrome 131 on Windows 11, Safari on iOS 18, Android WebView 130…
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Other versions and environment
      description: Framework version (React, Vue, Svelte, Angular), bundler, TypeScript version, and anything unusual (CSP, iframes, shadow DOM, zoom level).
      placeholder: |
        React 19.1, Vite 7, TypeScript 5.9, strict CSP
