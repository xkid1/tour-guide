# Groups the auto-generated release notes (`gh release create --generate-notes`
# in publish.yml) by the labels that labeler.yml and Dependabot apply.
# A PR goes in the first category whose labels it matches.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Dependencies
      labels:
        - dependencies
    - title: Library changes
      labels:
        - source
        - adapters
        - styles
    - title: Documentation
      labels:
        - documentation
    - title: Tests and benchmarks
      labels:
        - tests
        - e2e
        - benchmarks
    - title: Demo
      labels:
        - demo
    - title: CI and tooling
      labels:
        - ci
        - tooling
    - title: Other changes
      labels:
        - '*'
